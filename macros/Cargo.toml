[package]
description = "Procedural macros for up-rust"
edition = "2021"
license = "Apache-2.0"
name = "up-rust-macros"
repository = "https://github.com/eclipse-uprotocol/up-rust"
rust-version = "1.88"
version = "0.11.0-SNAPSHOT"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
