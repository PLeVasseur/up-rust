name: Default checks
'on':
  push:
    branches:
      - main
  pull_request: {}
  workflow_call:
    outputs:
      test_results_url:
        description: URL of current-compiler test logs
        value: ${{ jobs.current-tests.outputs.test_results_url }}
  workflow_dispatch: {}
permissions:
  contents: read
env:
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-latest
