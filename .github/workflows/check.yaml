          persist-credentials: false
      - run: python3 -m pip install -r tools/ci/requirements.txt
      - run: python3 tools/ci/generate.py --check
      - run: python3 -m unittest discover -s tools/ci -p "test_*.py"
      - run: bash -n tools/ci/gate.sh
  current-abi:
