[lints]
workspace = true

[workspace.lints.rust]
# Every public item is documented and every public type is inspectable.
# Copy is a per-type semver commitment, not a crate-wide hygiene default.
missing_docs = "deny"
missing_debug_implementations = "deny"
# Accept code blocks excluded from tarpaulin coverage checks.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[workspace.lints.clippy]
# see https://corrode.dev/blog/defensive-programming/#clippy-lints-for-defensive-programming
# Every unsafe block and every public unsafe fn states its proof obligation.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "allow"

