[package]
categories = ["api-bindings"]
description = "The Eclipse uProtocol Rust Language Library"
edition = "2021"
include = [
    "/build.rs",
    "/Cargo.toml",
    "/docs/*",
    "/examples/*",
    "/macros/**",
    "/README.md",
    "/src/**",
    "/up-spec/up-core-api/uprotocol/*",
]
keywords = ["uProtocol", "SDK", "communication"]
license = "Apache-2.0"
name = "up-rust"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-rust"
rust-version = "1.88"
version = "0.11.0-SNAPSHOT"

[features]
default = ["util"]
cloudevents = []
protobuf-wire = ["dep:protobuf", "dep:protobuf-codegen", "dep:protoc-bin-vendored"]
symphony = ["util", "dep:serde", "dep:serde_json", "dep:symphony"]
util = ["tokio/sync", "tokio/time"]
test-util = ["mockall"]
unsafe-stable-payload-tx = []
unsafe-stable-payload-init = []
unsafe-uninit-payload-bytes = []
expert-unsafe-payloads = [
    "unsafe-stable-payload-tx",
    "unsafe-stable-payload-init",
    "unsafe-uninit-payload-bytes",
]

[dependencies]
async-trait = { version = "0.1" }
base64 = { version = "0.22" }
bytes = { version = "1.11.1" }
iceoryx2-bb-derive-macros = { version = "0.9.0" }
iceoryx2-bb-elementary-traits = { version = "0.9.0" }
mediatype = "0.20"
mockall = { version = "0.13.1", optional = true }
protobuf = { version = "3.7.2", features = ["with-bytes"], optional = true }
rand = { version = "0.9" }
regex = { version = "1.11" }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
symphony = { version = "0.1", optional = true }
tokio = { version = "1.45.1", default-features = false, optional = true }
tracing = { version = "0.1", default-features = false, features = ["log", "std"] }
up-rust-macros = { path = "macros", version = "0.11.0-SNAPSHOT" }
uriparse = { version = "0.6" }
uuid-simd = { version = "0.8", default-features = false, features = ["std", "detect"] }

[build-dependencies]
protobuf-codegen = { version = "3.7.2", optional = true }
protoc-bin-vendored = { version = "3.2.0", optional = true }

[dev-dependencies]
clap = { version = "4.5.51" }
hex = { version = "0.4.3" }
mockall = { version = "0.13.1" }
test-case = { version = "3.3.1" }
time = { version = "0.3.47" }
tokio = { version = "1.45.1", default-features = false, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
trybuild = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-all-features]
# optional dependencies are activated by means of features only
skip_optional_dependencies = true
max_combination_size = 3

[[example]]
name = "owned_payload_codec"
required-features = ["util"]

[[example]]
name = "simple_publish"
required-features = ["util"]

[[example]]
name = "simple_notify"
required-features = ["util"]

[[example]]
name = "simple_rpc"
required-features = ["util"]

[[example]]
name = "symphony_target"
required-features = ["symphony"]

[[example]]
name = "zero_copy_payload_codec"
required-features = ["util"]

[[example]]
name = "mcap_payload_codec"
required-features = ["util"]

[[example]]
name = "stable_container_payload"
required-features = ["util"]

[[example]]
name = "protobuf_payload_codec"
required-features = ["protobuf-wire", "util"]

[[example]]
name = "protobuf_any_payload"
required-features = ["protobuf-wire", "util"]

[[example]]
name = "frame_wire_layers"
required-features = ["protobuf-wire", "util"]

[[bench]]
name = "payload_codecs"
harness = false
required-features = ["util"]


[lints.rust]
# this prevents cargo from complaining about code blocks
# excluded from tarpaulin coverage checks
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)', 'cfg(tarpaulin_include)'] }
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_unsafe = "deny"

[lints.clippy]
# see https://corrode.dev/blog/defensive-programming/#clippy-lints-for-defensive-programming
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
borrow_as_ptr = "deny"
ptr_as_ptr = "deny"
as_ptr_cast_mut = "deny"
not_unsafe_ptr_arg_deref = "deny"
transmute_ptr_to_ptr = "deny"
transmute_ptr_to_ref = "deny"
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "allow"
