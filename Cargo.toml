[package]
categories = ["api-bindings"]
description = "The Eclipse uProtocol Rust Language Library"
edition = "2021"
include = [
    "/abi/*",
    "/benches/*",
    "/build.rs",
    "/Cargo.toml",
    "/examples/*",
    "/proto/*",
    "/README.md",
    "/MIGRATION.md",
    "/src/*",
    "/test-fixtures/proto/**",
    "/tests/**",
    "/up-spec/up-core-api/uprotocol/*",
]
keywords = ["uProtocol", "SDK", "communication"]
license = "Apache-2.0"
name = "up-rust"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-rust"
rust-version = "1.88"
version = "0.10.0-SNAPSHOT"
resolver = "2"

[workspace]
members = ["macros", "tools/up-native-profile", "test-fixtures/native-inventory-types", "test-fixtures/native-inventory-export"]

[features]
default = []
cloudevents = ["protobuf-support"]
communication = [
    "up-l2-notifier",
    "up-l2-publisher",
    "up-l2-subscriber",
    "up-l2-rpc-client",
    "up-l2-rpc-server",
]
protobuf-support = ["dep:protobuf"]
payload-contract-fixtures = ["protobuf-wire", "zero-copy-transport", "dep:serde", "serde/derive", "dep:serde_json"]
payload-contract-large-fixtures = ["payload-contract-fixtures"]
payload-contract-simulator-fixtures = ["payload-contract-large-fixtures"]
symphony = ["up-l2-rpc-server", "dep:serde", "dep:serde_json", "dep:symphony"]
test-util = ["dep:mockall"]
# Generated core-service protobuf APIs and conversions.
up-core-api = ["protobuf-support"]
# Target-qualified native descriptors and deployment agreement.
native-identity = ["dep:sha2"]
selected-wire-codec-core = ["native-identity"]
selected-wire-transport-core = ["selected-wire-codec-core"]
selected-wire-transport-adapter = ["selected-wire-transport-core"]
selected-wire-user-api = ["selected-wire-transport-adapter", "up-core-api"]
transport-implementer-api = ["selected-wire-transport-core", "tokio/sync", "tokio/rt", "tokio/time"]
# One switch for wire and transport bindings: the implementer contracts, owned-frame
# and native-loan families and the selected-wire adapters, so a binding cannot miss
# transport-implementer-api. Bindings that need less can still compose the parts.
transport-implementer = ["transport-implementer-api", "owned-frame-transport", "wire-implementer-api", "selected-wire-user-api", "zero-copy-transport", "protobuf-wire"]
owned-frame-transport = ["selected-wire-transport-core", "up-core-api"]
wire-implementer-api = ["selected-wire-codec-core"]
protobuf-wire = ["up-core-api", "selected-wire-codec-core"]
zero-copy-transport = ["dep:up-rust-macros", "native-identity", "selected-wire-transport-core"]
native-inventory = ["zero-copy-transport", "dep:inventory"]
# Communication Layer traits, independently of their default implementations.
communication-api = []
# Primary typed roles; native loan capability remains an explicit additional feature.
typed-communication = ["selected-wire-user-api", "communication-api", "owned-frame-transport", "transport-implementer-api", "usubscription", "tokio/macros"]
up-l2-notifier = ["communication-api"]
up-l2-publisher = ["communication-api"]
up-l2-subscriber = ["communication-api", "usubscription"]
up-l2-rpc-client = ["communication-api", "up-core-api", "tokio/sync", "tokio/time"]
up-l2-rpc-server = ["communication-api", "up-core-api", "tokio/sync", "tokio/time"]
up-l2-zero-copy = ["communication-api", "selected-wire-user-api", "transport-implementer-api", "zero-copy-transport"]
udiscovery = ["up-l2-rpc-client"]
usubscription = ["up-l2-rpc-client"]
util = ["transport-implementer-api"]

[dependencies]
async-trait = { version = "0.1.92" }
bytes = { version = "1.12.1" }
# prevent usage of yanked 0.10.1 version of chacha20
chacha20 = { version = "0.10.2" }
fluent-uri = { version = "0.4.1", features = ["net"] }
# Pin the linked-registration implementation exercised by the target exporter tests.
inventory = { version = "=0.3.24", optional = true }
mediatype = "0.23.0"
mockall = { version = "0.15.0", optional = true }
protobuf = { version = "3.7.2", features = ["with-bytes"], optional = true }
rand = { version = "0.10.3" }
serde = { version = "1.0.228", optional = true }
serde_json = { version = "1.0.150", optional = true }
sha2 = { version = "0.11.0", optional = true }
symphony = { version = "0.1.5", optional = true }
thiserror = { version = "2.0.21" }
tokio = { version = "1.54.1", default-features = false, optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["log", "std"] }
up-rust-macros = { version = "0.10.0-SNAPSHOT", path = "macros", optional = true }
uuid-simd = { version = "0.8.0", default-features = false, features = ["std", "detect"] }

[build-dependencies]
protobuf-codegen = { version = "3.7.2" }
protoc-bin-vendored = { version = "3.2" }

[dev-dependencies]
clap = { version = "4.6.7" }
# addresses RUSTSEC-2026-0204
crossbeam-epoch = { version = "0.9.21" }
cucumber = { version = "0.23.0", features = ["output-junit"] }
hex = { version = "0.4.3" }
junit-report = { version = "0.9.1" }
mockall = { version = "0.15.0" }
pretty_assertions = { version = "1.4" }
# Keep property generation and its MSRV dependency closure at the tested version.
proptest = { version = "=1.5.0" }
# serde derive for example and test schemas using json_codec!; not a library dependency.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
test-case = { version = "3.4.0" }
trybuild = "=1.0.121"
tokio = { version = "1.53.1", default-features = false, features = [
    "macros",
    "test-util",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[[test]]
name = "prepared_paths_zero_alloc"
path = "tests/prepared_paths_zero_alloc.rs"
harness = false
required-features = ["payload-contract-fixtures", "transport-implementer-api", "test-util", "up-l2-zero-copy", "usubscription", "typed-communication"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo-all-features]
denylist = ["test-util"]
skip_feature_sets = [
    # the features on the left side include the features on the right side,
    # so there is no need to test them together
    ["up-core-api", "protobuf-support"],
    ["cloudevents", "protobuf-support"],
    ["symphony", "up-l2-rpc-server"],
    ["symphony", "communication-api"],
    ["communication", "up-l2-notifier"],
    ["communication", "up-l2-publisher"],
    ["communication", "up-l2-subscriber"],
    ["communication", "up-l2-rpc-client"],
    ["communication", "up-l2-rpc-server"],
    ["communication", "communication-api"],
    ["communication", "up-core-api"],
    ["communication", "protobuf-support"],
    ["communication", "usubscription"],
    ["up-l2-notifier", "communication-api"],
    ["up-l2-publisher", "communication-api"],
    ["up-l2-subscriber", "communication-api"],
    ["up-l2-subscriber", "usubscription"],
    ["up-l2-subscriber", "up-l2-rpc-client"],
    ["up-l2-subscriber", "up-core-api"],
    ["up-l2-rpc-client", "communication-api"],
    ["up-l2-rpc-client", "up-core-api"],
    ["up-l2-rpc-client", "protobuf-support"],
    ["up-l2-rpc-server", "communication-api"],
    ["up-l2-rpc-server", "up-core-api"],
    ["up-l2-rpc-server", "protobuf-support"],
    ["usubscription", "up-l2-rpc-client"],
    ["usubscription", "communication-api"],
    ["usubscription", "up-core-api"],
    ["usubscription", "protobuf-support"],
    ["udiscovery", "up-l2-rpc-client"],
    ["udiscovery", "communication-api"],
    ["udiscovery", "up-core-api"],
    ["udiscovery", "protobuf-support"],
]
# optional dependencies are activated by means of features only
skip_optional_dependencies = true
max_combination_size = 3

