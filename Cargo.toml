required-features = ["owned-frame-transport", "transport-implementer-api", "wire-implementer-api", "typed-communication"]

# Additive target for serialized-dispatch-controls-3 (R2/R3/R4). Merge once,
# next to the existing `serialized_dispatch` [[test]] entry. Same feature
# closure as that target so one admitted build serves both; the minimum
# closure actually used is owned-frame-transport + transport-implementer-api
# + wire-implementer-api. The standalone tests/ui/dispatch_controls_*.rs files
# are NOT Cargo targets: Cargo does not auto-discover tests/ui/*.rs, and no
# existing trybuild glob (tests/ui/<subdir>/*.rs or exact files) matches them.
[[test]]
name = "serialized_dispatch_controls"
path = "tests/serialized_dispatch_controls.rs"
required-features = ["owned-frame-transport", "transport-implementer-api", "wire-implementer-api", "typed-communication", "test-util"]

# independent-roles-proof-1: append once to up-rust/Cargo.toml (after the
# existing independent_native_roles target). REQUIRED before the two new
# tests/*.rs files land: Cargo auto-discovers tests/*.rs, and without these
# required-features a default-feature `cargo test` would try to build them.
# Feature sets mirror the existing independent_roles / independent_native_roles
# targets whose example supports these targets include.

[[test]]
name = "independent_roles_proof"
path = "tests/independent_roles_proof.rs"
required-features = ["typed-communication", "payload-contract-fixtures", "test-util", "wire-implementer-api"]

[[test]]
name = "independent_native_roles_proof"
path = "tests/independent_native_roles_proof.rs"
required-features = ["typed-communication", "payload-contract-fixtures", "test-util", "up-l2-zero-copy"]


[[test]]
name = "owned_rpc_join"
path = "tests/owned_rpc_join.rs"
required-features = ["typed-communication"]

# sdk-ergonomics-5: role set, schema simple paths. Same feature conventions as the
# user-first targets; entity_addressing.rs needs no extra features.
[[test]]
name = "role_set"
path = "tests/role_set.rs"
required-features = ["typed-communication", "test-util"]

[[test]]
name = "schema_simple_path"
