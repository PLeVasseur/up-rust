[package]
name = "up-native-profile"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
description = "Provisional native deployment agreement generation and admission"
readme = "README.md"
repository = "https://github.com/eclipse-uprotocol/up-rust"
categories = ["command-line-utilities", "development-tools"]
keywords = ["uprotocol", "native", "deployment"]
authors = ["Contributors to the Eclipse Foundation"]
homepage = "https://uprotocol.org"

[dependencies]
# Canonical descriptor artifacts use the standard alphabet and padding behavior
# qualified with this version; review artifact compatibility before changing it.
base64 = "=0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.20"
up-rust = { path = "../..", version = "=0.10.0-SNAPSHOT", default-features = false, features = ["native-inventory", "wire-implementer-api"] }

[dev-dependencies]
tempfile = "3.27.0"
test-case = "3.3.1"

[lints]
workspace = true
