    roles: [current, msrv]
    timeout: 1200
    command: [cargo, "+{toolchain}", check, --locked, --no-default-features, --features, native-inventory, --all-targets]
  - name: prepared-core-runtime-minimal
    group: tests
    roles: [current, msrv]
    timeout: 1800
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, -p, up-rust, --no-default-features, --features, "zero-copy-transport,transport-implementer-api", --lib]
  - name: external-wire-consumer
