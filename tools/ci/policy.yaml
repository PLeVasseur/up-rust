version: 1
toolchains:
  current: "stable"
  msrv: "1.88.0"
checks:
  - name: format
    group: style
    roles: [current]
    timeout: 120
    command: [cargo, "+{toolchain}", fmt, --all, --, --check]
  - name: check-all
    test_hooks: true
    group: check
    roles: [current, msrv]
    timeout: 1200
    command: [cargo, "+{toolchain}", check, --locked, --workspace, --all-features, --all-targets]
  - name: clippy-all
    test_hooks: true
    group: style
    roles: [current]
    timeout: 1200
    command: [cargo, "+{toolchain}", clippy, --locked, --workspace, --all-features, --all-targets, --, -D, warnings]
  - name: clippy-default
    test_hooks: true
    group: style
    roles: [current]
    timeout: 1200
    command: [cargo, "+{toolchain}", clippy, --locked, -p, up-rust, --no-default-features, --all-targets, --, -D, warnings]
  - name: docs-all
    group: docs
    roles: [current]
    timeout: 1200
    command: [cargo, "+{toolchain}", doc, --locked, --workspace, --all-features, --no-deps]
  - name: docs-default
    group: docs
    roles: [current]
    timeout: 1200
    command: [cargo, "+{toolchain}", doc, --locked, -p, up-rust, --no-default-features, --no-deps]
  - name: lib-core
    group: tests
    roles: [current, msrv]
    timeout: 1200
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, -p, up-rust, --features, "protobuf-support,communication-api", --lib]
  - name: doctests-core
    group: tests
    roles: [current, msrv]
    timeout: 1200
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, -p, up-rust, --features, "protobuf-support,communication-api", --doc]
  - name: lib-all
    group: tests
    roles: [current, msrv]
    timeout: 1200
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, --workspace, --all-features, --lib]
  - name: lib-default
    group: tests
    roles: [current, msrv]
    timeout: 1200
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, -p, up-rust, --no-default-features, --lib]
  - name: doctests-all
    group: tests
    roles: [current, msrv]
    timeout: 1200
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, --workspace, --all-features, --doc]
