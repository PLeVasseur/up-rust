    roles: [current, msrv]
    timeout: 1200
    command: [python3, tools/ci/check_native_tool.py, --toolchain, "{toolchain}"]
  - name: zero-copy-roles-minimal
    group: tests
    roles: [current, msrv]
    timeout: 1200
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, -p, up-rust, --no-default-features, --features, up-l2-zero-copy, --lib, "communication::zero_copy"]
