    roles: [current, msrv]
    timeout: 1800
    command: [python3, tools/ci/check_prepared_allocation.py, --toolchain, "{toolchain}", --profile, release, --bench]
  # The safety path: no features or dependencies, a sysroot without alloc or std,
  # a link-time panic check and a symbol check on the linked image.
  - name: up-rust-core-gates
    group: tests
    roles: [current, msrv]
    timeout: 1800
    command: [python3, tools/ci/check_core_gates.py, --toolchain, "{toolchain}"]
  # Differential tests of the hand-written URI and UUID parsers against the
  # libraries they replaced.
  - name: core-parser-differential
    group: tests
    roles: [current, msrv]
    timeout: 1800
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, --all-features, --test, core_parser_differential]
  # The heap guard's own contract: exact counts, thread scoping and failure reporting.
  - name: heap-guard-contract
    group: tests
    roles: [current, msrv]
    timeout: 1200
    command: [cargo, "+{toolchain}", test, --locked, --all-features, --test, heap_guard_contract]
  - name: heap-guard-not-installed
