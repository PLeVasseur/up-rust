    timeout: 600
    command: [python3, tools/ci/check_native_features.py, --toolchain, "{toolchain}"]
  # Every `unsafe` site is in tools/ci/unsafe_inventory.toml with a reason.
  - name: unsafe-inventory
    group: check
    roles: [current, msrv]
    timeout: 120
    command: [python3, tools/ci/check_unsafe_inventory.py]
  - name: zero-copy-minimal
