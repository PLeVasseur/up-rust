    command: [cargo, "+{toolchain}", test, --locked, -p, up-rust, --no-default-features, --features, "wire-implementer-api,owned-frame-transport", --test, fake_external_wire]
  - name: native-role-guide-minimal
    group: docs
    roles: [current, msrv]
    timeout: 1800
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, -p, up-rust, --no-default-features, --features, up-l2-zero-copy, --doc]
  - name: native-inventory
    group: tests
