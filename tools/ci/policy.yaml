    timeout: 600
    command: [cargo, "+{toolchain}", check, --locked, --no-default-features, --example, symphony_target, --features, "symphony,up-l2-rpc-client,up-l2-rpc-server,util"]
  - name: abi-layout
    group: abi
    roles: [current, msrv]
    timeout: 600
    command: [bash, tools/ci/check_abi.sh, "{toolchain}"]
  - name: wire-private-identity
    group: tests
    roles: [current, msrv]
    timeout: 600
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, --all-features, --test, wire_private_identity]
  - name: metadata-conformance
    group: tests
    roles: [current, msrv]
