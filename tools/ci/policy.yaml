  - name: example-notify
    group: tests
    roles: [current, msrv]
    timeout: 600
    command: [cargo, "+{toolchain}", check, --locked, --no-default-features, --example, simple_notify, --features, "up-l2-notifier,protobuf-support,util"]
  - name: example-publish
