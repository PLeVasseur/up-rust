    roles: [current, msrv]
    timeout: 1200
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, --all-features, --test, heap_guard_not_installed]
  # A window that needs the C-level observer refuses to run without it. The positive
  # controls need the observer preloaded and run from tools outside this gate.
  - name: heap-guard-c-level-not-loaded
    group: tests
    roles: [current, msrv]
    timeout: 1200
    completion: libtest
    command: [cargo, "+{toolchain}", test, --locked, --all-features, --test, heap_guard_c_level_not_loaded]
