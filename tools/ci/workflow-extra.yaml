# Existing independent documentation-link and feature-powerset checks.
check-links:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Restore lychee cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .lycheecache
        key: cache-lychee-${{ github.sha }}
        restore-keys: cache-lychee-
    - name: Run lychee
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
      with:
        args: "--cache --max-cache-age 1d --verbose --no-progress -- ."
feature-check:
  runs-on: ubuntu-latest
  env:
    RUSTUP_TOOLCHAIN: "@CURRENT_TOOLCHAIN@"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
      with:
        toolchain: "@CURRENT_TOOLCHAIN@"
    - name: Install cargo-hack
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        host=$(rustc -vV | grep '^host:' | cut -d' ' -f2)
        curl --proto '=https' --tlsv1.2 -fsSL -o cargo-hack.tar.gz "https://github.com/taiki-e/cargo-hack/releases/latest/download/cargo-hack-${host}.tar.gz"
        gh release -R https://github.com/taiki-e/cargo-hack verify-asset cargo-hack.tar.gz
        gh attestation verify --repo taiki-e/cargo-hack --signer-workflow taiki-e/github-actions/.github/workflows/rust-release.yml cargo-hack.tar.gz
        tar xf cargo-hack.tar.gz -C "${CARGO_HOME:-"$HOME/.cargo"}"/bin
        rm cargo-hack.tar.gz
    - name: Run isolated locked feature powerset
      run: |
        python3 tools/ci/feature_gate.py \
          --root "$GITHUB_WORKSPACE" \
          --toolchain "$RUSTUP_TOOLCHAIN" \
          --target "$RUNNER_TEMP/up-rust-feature-target" \
          --result "$RUNNER_TEMP/up-rust-feature-results"
    - name: Preserve feature snapshot, logs and lock audit
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: feature-results
        path: ${{ runner.temp }}/up-rust-feature-results/
        if-no-files-found: error
