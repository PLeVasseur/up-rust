# Every `unsafe` site in this repository, checked by tools/ci/check_unsafe_inventory.py.
#
# A site is identified by its file, its enclosing item and its normalized text.
# Line numbers are never part of a site's identity.
#
# reason = "row:ID"            maps the site to a row of [rows] below, which is
#                              the design's table of `unsafe` obligations.
# reason = "test-only: WHY"    is a stated reason for test code. It is refused on
#                              code outside test_paths and #[cfg(test)] items.
#
# When the gate fails: run the script with --update, write a reason for each new
# entry, and review the change as you would the `unsafe` code itself.
schema = 1

test_paths = [
    "tests/*",
    "benches/*",
    "test-fixtures/*",
    "core/tests/*",
    "core/verify/*",
    "src/test_util/*",
    "src/bench_fixtures/*",
    "*/tests.rs",
]

[rows]
binding-ffi = "A binding's own FFI or shared-memory code"
carrier-slots = "Carrier ingress slots and `ParkedFrame`: one owner by index; a retained frame stays in its slot until the slot is released"
envelope-writers = "Envelope writers (`as_uninit_mut`)"
header-writers = "`frame/header.rs` uninitialized writers"
heap-guard = "`heap_guard`, `heap_guard::c_level`"
old-inline-dispatch = "Old path, no design row: `InlineFuture` inline erased-future storage for owned-frame and serialized dispatch"
old-listener-admission = "Old path, no design row: `src/listener_admission.rs`, removed at design 8.2"
old-zero-copy = "Old path, no design row: `src/zero_copy/{pool,pool_core,token,tx}.rs` slot pool, wipe-on-release and uninit TX buffers"
platform = "Platform backends"
prepared-tx = "`PreparedTxStorage`, `InitializedTx::from_initialized`"
ready-queue = "`ReadyQueue` (`AtomicPtr`)"
retained-frame = "`RetainedFrame` inline owner (`UnsafeCell` storage)"
route-wake = "`RouteWake` in core: `Send`, `Sync`, and the hook transmute"
running-cell = "Running-value cell for `RuntimePort`"
slot-tables = "Slot tables, `Received<T>` deref, `SlotPool`, their `Send` and `Sync`"
stable-payload = "`RxAdmission::check_frame`, `StablePayload`, `StablePayloadInit`, derives"
startup-memory = "`StartupMemory` placement, `FixedVec`, `StaticSlots`' `Sync`"
startup-region = "`StartupRegion`, `RegionHeader`, `Chain` `Sync`; `up-rust` `startup.rs` `set_len`"
startup-slot = "`StartupSlot::zeroed`, `unsafe trait ZeroSlot`"
transport-signal = "`TransportShared.signal` pointer read"
truncate-payload = "`truncate_payload`"
waker-cell = "`WakerCell` (`up-rust-tokio`)"
writer = "`PayloadWriter::as_written`, `zeroed`"

